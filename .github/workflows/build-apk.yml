name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: daily-dose-of-gita-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a release (download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Dose-of-Gita.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Daily-Dose-of-Gita.apk --title "Daily Dose of Gita (test APK)" --notes "Latest test build"
