name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEYS: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android
      - name: Restore signing key
        if: env.HAS_KEYS == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
      - run: python3 scripts/patch_android.py
      - run: npx cap sync android
      - name: Build debug APK (for testing)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Build signed AAB (for Play Store)
        if: env.HAS_KEYS == 'true'
        run: cd android && ./gradlew bundleRelease
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Dose-of-Gita.apk
          FILES="Daily-Dose-of-Gita.apk"
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab Daily-Dose-of-Gita.aab
            FILES="$FILES Daily-Dose-of-Gita.aab"
          fi
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest $FILES --title "Daily Dose of Gita (build ${{ github.run_number }})" --notes "Latest build"
